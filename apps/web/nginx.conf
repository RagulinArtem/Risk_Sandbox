server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The production host proxies this container through a shared nginx.
    # Compress application assets at the origin so large JavaScript responses
    # remain reliable across that hop and load faster for the browser.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/javascript application/json image/svg+xml text/css;

    # index.html must be revalidated on every load, otherwise an open tab
    # keeps the previous deploy's bundle until a hard refresh. Hashed files
    # under /assets/ stay cached for a year (their names change per build).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        gzip_static always;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
