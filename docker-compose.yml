services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      # Belt-and-suspenders: Dockerfile's directory layout already makes
      # this resolve correctly, but pin it explicitly so a future layout
      # change can't silently break data loading in production.
      - DATA_DIR=/app/data
    ports:
      # API_PUBLISH lets a shared host bind to loopback behind its own
      # reverse proxy (e.g. 127.0.0.1:18600); defaults keep local dev as-is.
      - "${API_PUBLISH:-8000}:${API_PORT:-8000}"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped
    depends_on:
      - api
