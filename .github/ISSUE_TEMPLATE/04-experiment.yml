name: Experiment
description: A time-boxed spike or investigation (e.g. "can we use X API?")
labels: ["hackathon"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question to answer
    validations:
      required: true
  - type: input
    id: timebox
    attributes:
      label: Timebox
      description: e.g. "30 min", "1 hour"
    validations:
      required: false
  - type: textarea
    id: outcome
    attributes:
      label: Outcome / findings
      description: Fill in once done — link to docs/DECISIONS.md if it changes a decision.
    validations:
      required: false
